# The provider reads this only at startup: restart the Deployment after
# changing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: credprovider-token-exchange-config
  namespace: ate-system
data:
  config.yaml: |
    providerName: sts
    profiles:
    - name: gcp
      tokenUrl: https://sts.googleapis.com/v1/token
      audience: //iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
      scopes: ["https://www.googleapis.com/auth/cloud-platform"]
    policy:
      atespaces:
        team-a: ["gcp"]
