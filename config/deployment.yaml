apiVersion: apps/v1
kind: Deployment
metadata:
  name: credprovider-token-exchange
  namespace: ate-system
  labels:
    app: credprovider-token-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credprovider-token-exchange
  template:
    metadata:
      labels:
        app: credprovider-token-exchange
    spec:
      serviceAccountName: credprovider-token-exchange
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: credprovider-token-exchange
        image: ko://plugins.go.ate.dev/credprovider-token-exchange/cmd/credprovider-token-exchange
        args:
        - "--listen-address=:50051"
        - "--health-address=:9090"
        - "--config=/etc/credprovider-token-exchange/config.yaml"
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
        - "--ateapi-address=dns:///api.ate-system.svc:443"
        - "--ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
        - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
        - "--ateapi-server-name=api.ate-system.svc"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: health
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/credprovider-token-exchange
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: credprovider-token-exchange-config
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
